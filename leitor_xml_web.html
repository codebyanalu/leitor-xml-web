<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCON/SIAN — NF-e / NFS-e</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--prim:#1a5276;--sec:#2980b9;--acent:#e67e22;--fundo:#f0f3f7;--f2:#fff;--side:#1c2833;--side2:#2c3e50;--texto:#1a252f;--tex2:#5d6d7e;--borda:#d5d8dc;--ok:#1e8449;--warn:#d68910;--err:#c0392b;--info:#2471a3}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--fundo);color:var(--texto);display:flex;height:100vh;overflow:hidden}
#sidebar{width:250px;min-width:250px;background:var(--side);display:flex;flex-direction:column;height:100vh}
#logo{background:var(--prim);padding:16px;text-align:center}
#logo h1{color:#fff;font-size:18px;font-weight:700}
#logo p{color:#aed6f1;font-size:11px;margin-top:2px}
#logo .bar{height:3px;background:var(--acent);margin:10px -16px -16px}
.nav-section{padding:8px 16px 2px;color:#7f8c8d;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;color:#bdc3c7;cursor:pointer;font-size:12px;transition:.15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-btn:hover{background:var(--side2);color:#fff}
.nav-btn.active{background:var(--prim);color:#fff;font-weight:600}
.nav-btn .icon{font-size:15px;width:20px;text-align:center}
#sidebar .spacer{flex:1}
#btn-fechar{background:var(--err);color:#fff;padding:14px 16px;cursor:pointer;font-weight:600;font-size:12px;border:none;width:100%;text-align:left;font-family:inherit;display:flex;align-items:center;gap:8px;transition:.15s}
#btn-fechar:hover{background:#a93226}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--prim);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
#topbar h2{color:#fff;font-size:14px;font-weight:600}
#topbar .hora{color:#aed6f1;font-size:11px}
#accent-bar{height:3px;background:var(--acent)}
#content{flex:1;overflow-y:auto;padding:12px 20px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-bottom:10px}
.kpi-card{background:var(--f2);border-radius:4px;border:1px solid var(--borda);overflow:hidden}
.kpi-card .bar{height:4px}
.kpi-card .body{padding:6px 10px}
.kpi-card .label{font-size:9px;font-weight:700;color:var(--tex2);text-transform:uppercase}
.kpi-card .value{font-size:18px;font-weight:700;color:var(--texto);margin-top:1px}
.kpi-card .sub{font-size:9px;color:var(--tex2);margin-top:1px}
#upload-area{border:2px dashed var(--borda);border-radius:8px;padding:30px 20px;text-align:center;background:var(--f2);cursor:pointer;transition:.2s;margin-bottom:12px}
#upload-area:hover,#upload-area.dragover{border-color:var(--sec);background:#eaf2fb}
#upload-area .icon{font-size:40px;color:var(--tex2)}
#upload-area p{color:var(--tex2);margin-top:6px;font-size:13px}
#upload-area .sub{font-size:10px;color:var(--tex2);margin-top:3px}
#file-input{display:none}
.tab-content{display:none}.tab-content.active{display:block}
.nota-card{background:var(--f2);border:1px solid var(--borda);border-radius:6px;margin-bottom:10px;overflow:hidden}
.nota-card .header{background:var(--prim);color:#fff;padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;user-select:none}
.nota-card .header .tipo{border:1px solid rgba(255,255,255,.4);padding:1px 7px;border-radius:3px;font-size:9px;font-weight:600}
.nota-card .header .toggle{font-size:11px;opacity:.7;transition:.2s}
.nota-card .header .toggle.open{transform:rotate(180deg)}
.nota-card .body-detail{padding:14px;display:none;border-top:1px solid var(--borda)}
.nota-card .body-detail.open{display:block}
.nota-card table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px}
.nota-card table th,.nota-card table td{padding:3px 6px;border:1px solid var(--borda);text-align:left}
.nota-card table th{background:var(--prim);color:#fff;font-weight:600;font-size:10px}
.nota-card table tr:nth-child(even){background:#f7f9fc}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.info-box{border:1px solid var(--borda);border-radius:4px;padding:6px 10px}
.info-box h4{font-size:10px;color:var(--prim);font-weight:700;margin-bottom:3px;text-transform:uppercase}
.info-box .row{font-size:11px;padding:1px 0;display:flex}
.info-box .row .lbl{color:var(--tex2);width:80px;flex-shrink:0}
.table-wrap{overflow-x:auto;margin-bottom:8px;border:1px solid var(--borda);border-radius:4px}
.table-wrap table{margin-bottom:0}
.det-section{margin:6px 0;border:1px solid var(--borda);border-radius:4px;overflow:hidden}
.det-section .det-title{padding:4px 10px;background:#eaf2fb;font-size:10px;font-weight:700;color:var(--prim);cursor:pointer;user-select:none}
.det-section .det-body{padding:6px;display:none;overflow-x:auto}
.det-section .det-body.open{display:block}
.det-section .det-body table{font-size:10px;margin-bottom:0}
.det-section .det-body table th{font-size:9px;background:var(--side2);padding:2px 5px}
.det-section .det-body table td{padding:2px 5px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:12px}
.dash-card{background:var(--f2);border:1px solid var(--borda);border-radius:6px;padding:10px;min-height:220px}
.dash-card h4{font-size:11px;font-weight:700;color:var(--prim);margin-bottom:6px;text-transform:uppercase}
.dash-card .chart-wrap{position:relative;height:200px}
.filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{padding:5px 8px;font-size:11px;border:1px solid var(--borda);border-radius:4px;font-family:inherit;background:var(--f2)}
.filter-bar input{flex:1;min-width:120px}
.filter-bar .count{font-size:11px;color:var(--tex2);margin-left:auto}
.btn{padding:6px 14px;font-size:11px;font-weight:600;border:none;border-radius:4px;cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn-prim{background:var(--prim);color:#fff}.btn-prim:hover{background:#154360}
.btn-sec{background:var(--sec);color:#fff}.btn-sec:hover{background:#1f618d}
.btn-acent{background:var(--acent);color:#fff}.btn-acent:hover{background:#ca6f1e}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#196f3d}
#status-bar{background:var(--f2);border:1px solid var(--borda);border-radius:4px;padding:6px 10px;margin-bottom:10px;font-size:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.empty-state{text-align:center;padding:40px;color:var(--tex2)}
.empty-state .icon{font-size:40px;margin-bottom:10px}
.empty-state p{font-size:13px}
#import-log{background:#1c2833;color:#d5d8dc;border-radius:4px;padding:10px;font-family:Consolas,monospace;font-size:11px;max-height:250px;overflow-y:auto;white-space:pre-wrap}
#loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999}
#loading-overlay.active{display:flex}
#loading-box{background:#fff;padding:24px 36px;border-radius:8px;text-align:center}
#loading-box .spinner{width:36px;height:36px;border:3px solid var(--borda);border-top-color:var(--prim);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
#content::-webkit-scrollbar{width:6px}#content::-webkit-scrollbar-track{background:transparent}#content::-webkit-scrollbar-thumb{background:var(--borda);border-radius:3px}
#error-banner{background:#c0392b;color:#fff;padding:8px 14px;border-radius:4px;margin-bottom:10px;font-size:12px;display:none}
</style>
</head>
<body>

<div id="loading-overlay"><div id="loading-box"><div class="spinner"></div><div id="loading-msg">Processando...</div></div></div>

<nav id="sidebar">
  <div id="logo"><h1>GCON / SIAN</h1><p>NF-e | NFS-e</p><div class="bar"></div></div>
  <div class="nav-section">IMPORTAR</div>
  <button class="nav-btn active" data-tab="importar"><span class="icon">📁</span><span>Importar XMLs</span></button>
  <div class="nav-section">VISUALIZAR</div>
  <button class="nav-btn" data-tab="nfe"><span class="icon">📦</span><span>NF-e (Peças)</span></button>
  <button class="nav-btn" data-tab="nfse"><span class="icon">📋</span><span>NFS-e (Serviços)</span></button>
  <button class="nav-btn" data-tab="dashboard"><span class="icon">📊</span><span>Dashboard</span></button>
  <div class="nav-section">EXPORTAR</div>
  <button class="nav-btn" data-tab="exportar"><span class="icon">⬇</span><span>Exportar Dados</span></button>
  <div class="spacer"></div>
  <button id="btn-fechar"><span>✕</span> FECHAR SISTEMA</button>
</nav>

<div id="main">
  <div id="topbar"><h2>SISTEMA DE EXTRAÇÃO — NF-e / NFS-e</h2><span class="hora" id="hora"></span></div>
  <div id="accent-bar"></div>
  <div id="content">
    <div id="status-bar">
      <span>📦 <span id="s-nfe">0</span> produtos NF-e</span>
      <span>📋 <span id="s-nfse">0</span> serviços NFS-e</span>
      <span>📁 <span id="s-arqs">0</span> XMLs</span>
      <span style="margin-left:auto;font-size:9px;color:var(--tex2)" id="s-sessao"></span>
    </div>

    <div class="tab-content active" id="tab-importar">
      <div id="error-banner"></div>
      <div id="upload-area">
        <div class="icon">📂</div>
        <p><strong>Clique aqui</strong> ou arraste XMLs</p>
        <p class="sub">NF-e (modelo 55) e NFS-e (CompNFe / NFSe Nacional)</p>
      </div>
      <div id="import-log"></div>
    </div>

    <div class="tab-content" id="tab-nfe">
      <div class="filter-bar">
        <input type="text" id="filtro-nfe" placeholder="Buscar na NF-e..." oninput="renderNFE()">
        <select id="filtro-nfe-cnpj" onchange="renderNFE()"><option value="">Todos emitentes</option></select>
        <span class="count" id="nfe-count"></span>
      </div>
      <div id="nfe-list"></div>
    </div>

    <div class="tab-content" id="tab-nfse">
      <div class="filter-bar">
        <input type="text" id="filtro-nfse" placeholder="Buscar na NFS-e..." oninput="renderNFSe()">
        <select id="filtro-nfse-cnpj" onchange="renderNFSe()"><option value="">Todos prestadores</option></select>
        <span class="count" id="nfse-count"></span>
      </div>
      <div id="nfse-list"></div>
    </div>

    <div class="tab-content" id="tab-dashboard">
      <div class="kpi-row" id="dash-kpis"></div>
      <div class="dash-grid" id="dash-charts"></div>
    </div>

    <div class="tab-content" id="tab-exportar">
      <div style="padding:20px 0;text-align:center">
        <p style="margin-bottom:14px;color:var(--tex2)">Exporte os dados processados para CSV ou Excel.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-prim" onclick="exportCSV('nfe')">⬇ CSV NF-e</button>
          <button class="btn btn-sec" onclick="exportCSV('nfse')">⬇ CSV NFS-e</button>
          <button class="btn btn-acent" onclick="exportXLSX('nfe')">⬇ Excel NF-e</button>
          <button class="btn btn-ok" onclick="exportXLSX('nfse')">⬇ Excel NFS-e</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
console.log('GCON/SIAN iniciado');

// ═══ DATA ═══
const DB={nfe:[],nfse:[],arquivos:0,sessaoId:Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
const HNFE=['Tipo_Nota','Chave_NFe','Numero_NFe','Serie_NFe','Mod_NFe','NatOp','Tp_NF','Data_Emissao',
  'CNPJ_Emitente','Nome_Emitente','NomeFantasia_Emit','IE_Emitente','UF_Emitente','Mun_Emitente',
  'CNPJ_Destinatario','CPF_Destinatario','Nome_Destinatario','IE_Destinatario','UF_Destinatario','Mun_Destinatario',
  'Item','cProd','cEAN','xProd','NCM','CEST','CFOP','uCom','qCom','vUnCom','vProd','indEscala','nFCI',
  'ICMS_orig','ICMS_CST','ICMS_modBC','ICMS_vBC','ICMS_pICMS','ICMS_vICMS',
  'ICMS_vBCSTRet','ICMS_pST','ICMS_vICMSSubstituto','ICMS_vICMSSTRet',
  'ICMS_pRedBCEfet','ICMS_vBCEfet','ICMS_pICMSEfet','ICMS_vICMSEfet',
  'IPI_cEnq','IPI_CST','IPI_vBC','IPI_pIPI','IPI_vIPI',
  'PIS_CST','PIS_vBC','PIS_pPIS','PIS_vPIS',
  'COFINS_CST','COFINS_vBC','COFINS_pCOFINS','COFINS_vCOFINS',
  'IBS_CST','cClassTrib','IBS_vBC','pIBSUF','vIBSUF','pIBSMun','vIBSMun','IBS_vIBS','pCBS','CBS_vCBS',
  'Arquivo_Origem'];
const HNFSE=['Tipo_Nota','Formato','Chave_NFSe','Numero_NFSe','Serie_RPS',
  'Data_Emissao','Data_Competencia','Municipio_Prestacao',
  'cTribNac','xDescServ','cNBS_DPS','Cod_Servico_Mun','Desc_Servico','Cod_Item_Lei116','Cod_NBS',
  'ISS_Retido','BC_ISS','Aliq_ISS','Valor_ISS','pAliq_ISS','tpRetISSQN',
  'BC_CSRF','Valor_PIS','Valor_COFINS','Valor_CSLL','BC_IRRF','Valor_IRRF','BC_INSS','Valor_INSS',
  'pTotTribSN','IBS_vBC','IBS_pIBSUF','IBS_vIBSUF','IBS_pIBSMun','IBS_vIBSMun',
  'CBS_pCBS','CBS_vCBS','cClassTrib',
  'Valor_Bruto','Valor_Liquido','Discriminacao',
  'CNPJ_Prestador','IM_Prestador','Nome_Prestador','NomeFantasia_Prestador',
  'UF_Prestador','Mun_Prestador','Email_Prestador','Simples_Nacional',
  'CNPJ_Tomador','IM_Tomador','Nome_Tomador','Mun_Tomador','UF_Tomador','Email_Tomador',
  'Arquivo_Origem'];

// ═══ UTILITIES ═══
function t(el,tag,def){if(!el)return def||'';const e=el.querySelector(tag);return e&&e.textContent?e.textContent.trim():def||''}
function rmNS(x){return x.replace(/xmlns(:[^=]+)?="[^"]+"/g,'').replace(/<\?xml[^?>]*\?>/g,'')}
function parseXML(texto){
  const doc=new DOMParser().parseFromString(rmNS(texto),'text/xml');
  const err=doc.querySelector('parsererror');
  if(err)throw new Error('Erro ao parsear XML: '+(err.textContent||'').slice(0,100));
  return doc;
}
function f(v){if(v===null||v===undefined)return 0;const s=String(v).replace(/[^0-9,\-]/g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n}
function moeda(v){const x=f(v);return x?`R$ ${x.toFixed(2).replace('.',',')}`:''}
function vl(v){const s=String(v||'').trim();return(!s||s==='nan'||s==='None')?'':s}
function dataBr(d){if(!d||d==='nan'||d==='None')return'';return String(d).slice(0,10)}
function agora(){const d=new Date();return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}

// ═══ FILE READING ═══
function readFileAsText(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('Erro ao ler '+file.name));
    reader.readAsText(file,'UTF-8');
  });
}

// ═══ EXTRACT NF-e ═══
function extrairNFE(nome,texto){
  const doc=parseXML(texto);const root=doc.documentElement;
  let nfe=root.querySelector('NFe')||(root.tagName.includes('NFe')?root:null);
  if(!nfe)return{ok:false,msg:'Tag NFe nao encontrada'};
  const inf=nfe.querySelector('infNFe');if(!inf)return{ok:false,msg:'Tag infNFe nao encontrada'};
  const ide=inf.querySelector('ide'),emit=inf.querySelector('emit'),dest=inf.querySelector('dest');
  const ee=inf.querySelector('enderEmit'),ed=inf.querySelector('enderDest');
  const chave=(inf.getAttribute('Id')||'').replace('NFe','');
  const dets=inf.querySelectorAll('det');const produtos=[];
  const tagsICMS=['ICMS00','ICMS10','ICMS20','ICMS30','ICMS40','ICMS41','ICMS50','ICMS51','ICMS60','ICMS70','ICMS90','ICMSSN101','ICMSSN102','ICMSSN201','ICMSSN202','ICMSSN500','ICMSSN900'];
  const tagsPIS=['PISAliq','PISQtde','PISNT','PISOutr','PISSN'];
  const tagsCOFINS=['COFINSAliq','COFINSQtde','COFINSNT','COFINSOutr','COFINSSN'];
  for(const det of dets){
    const prod=det.querySelector('prod');if(!prod)continue;
    const imp=det.querySelector('imposto');
    const base={
      Tipo_Nota:'NF-e',Chave_NFe:chave,Numero_NFe:t(ide,'nNF'),Serie_NFe:t(ide,'serie'),
      Mod_NFe:t(ide,'mod'),NatOp:t(ide,'natOp'),Tp_NF:t(ide,'tpNF'),Data_Emissao:t(ide,'dhEmi'),
      CNPJ_Emitente:t(emit,'CNPJ'),Nome_Emitente:t(emit,'xNome'),NomeFantasia_Emit:t(emit,'xFant'),
      IE_Emitente:t(emit,'IE'),UF_Emitente:ee?t(ee,'UF'):t(emit,'UF'),Mun_Emitente:ee?t(ee,'xMun'):'',
      CNPJ_Destinatario:t(dest,'CNPJ'),CPF_Destinatario:t(dest,'CPF'),Nome_Destinatario:t(dest,'xNome'),
      IE_Destinatario:t(dest,'IE'),UF_Destinatario:ed?t(ed,'UF'):'',Mun_Destinatario:ed?t(ed,'xMun'):'',
      Item:det.getAttribute('nItem')||'',cProd:t(prod,'cProd'),cEAN:t(prod,'cEAN'),
      xProd:t(prod,'xProd'),NCM:t(prod,'NCM'),CEST:t(prod,'CEST'),CFOP:t(prod,'CFOP'),
      uCom:t(prod,'uCom'),qCom:t(prod,'qCom'),vUnCom:t(prod,'vUnCom'),vProd:t(prod,'vProd'),
      indEscala:t(prod,'indEscala'),nFCI:t(prod,'nFCI'),
      ICMS_orig:'',ICMS_CST:'',ICMS_modBC:'',ICMS_vBC:'',ICMS_pICMS:'',ICMS_vICMS:'',
      ICMS_vBCSTRet:'',ICMS_pST:'',ICMS_vICMSSubstituto:'',ICMS_vICMSSTRet:'',
      ICMS_pRedBCEfet:'',ICMS_vBCEfet:'',ICMS_pICMSEfet:'',ICMS_vICMSEfet:'',
      IPI_cEnq:'',IPI_CST:'',IPI_vBC:'',IPI_pIPI:'',IPI_vIPI:'',
      PIS_CST:'',PIS_vBC:'',PIS_pPIS:'',PIS_vPIS:'',
      COFINS_CST:'',COFINS_vBC:'',COFINS_pCOFINS:'',COFINS_vCOFINS:'',
      IBS_CST:'',cClassTrib:'',IBS_vBC:'',pIBSUF:'',vIBSUF:'',pIBSMun:'',vIBSMun:'',IBS_vIBS:'',pCBS:'',CBS_vCBS:'',
      Arquivo_Origem:nome
    };
    if(imp){
      const icms=imp.querySelector('ICMS');
      if(icms)for(const f of icms.children){
        if(tagsICMS.some(t=>f.tagName.includes(t))){
          base.ICMS_orig=t(f,'orig');base.ICMS_CST=t(f,'CST');base.ICMS_modBC=t(f,'modBC');
          base.ICMS_vBC=t(f,'vBC');base.ICMS_pICMS=t(f,'pICMS');base.ICMS_vICMS=t(f,'vICMS');
          base.ICMS_vBCSTRet=t(f,'vBCSTRet');base.ICMS_pST=t(f,'pST');
          base.ICMS_vICMSSubstituto=t(f,'vICMSSubstituto');base.ICMS_vICMSSTRet=t(f,'vICMSSTRet');
          base.ICMS_pRedBCEfet=t(f,'pRedBCEfet');base.ICMS_vBCEfet=t(f,'vBCEfet');
          base.ICMS_pICMSEfet=t(f,'pICMSEfet');base.ICMS_vICMSEfet=t(f,'vICMSEfet');break;
        }
      }
      const ipi=imp.querySelector('IPI');
      if(ipi){base.IPI_cEnq=t(ipi,'cEnq');for(const s of['IPITrib','IPINT']){const el=ipi.querySelector(s);if(el){base.IPI_CST=t(el,'CST');base.IPI_vBC=t(el,'vBC');base.IPI_pIPI=t(el,'pIPI');base.IPI_vIPI=t(el,'vIPI');break;}}}
      const pis=imp.querySelector('PIS');
      if(pis)for(const f of pis.children){if(tagsPIS.some(t=>f.tagName.includes(t))){base.PIS_CST=t(f,'CST');base.PIS_vBC=t(f,'vBC');base.PIS_pPIS=t(f,'pPIS');base.PIS_vPIS=t(f,'vPIS');break;}}
      const cof=imp.querySelector('COFINS');
      if(cof)for(const f of cof.children){if(tagsCOFINS.some(t=>f.tagName.includes(t))){base.COFINS_CST=t(f,'CST');base.COFINS_vBC=t(f,'vBC');base.COFINS_pCOFINS=t(f,'pCOFINS');base.COFINS_vCOFINS=t(f,'vCOFINS');break;}}
      let ibscbs=imp.querySelector('IBSCBS')||imp.querySelector('IBS');
      if(ibscbs){
        base.IBS_CST=t(ibscbs,'CST');base.cClassTrib=t(ibscbs,'cClassTrib');
        let g=ibscbs.querySelector('gIBSCBS')||ibscbs;
        base.IBS_vBC=t(g,'vBC');
        const guf=g.querySelector('gIBSUF');if(guf){base.pIBSUF=t(guf,'pIBSUF');base.vIBSUF=t(guf,'vIBSUF');}
        const gmun=g.querySelector('gIBSMun');if(gmun){base.pIBSMun=t(gmun,'pIBSMun');base.vIBSMun=t(gmun,'vIBSMun');}
        base.IBS_vIBS=t(g,'vIBS');
        const gcbs=g.querySelector('gCBS');if(gcbs){base.pCBS=t(gcbs,'pCBS');base.CBS_vCBS=t(gcbs,'vCBS');}
        else{const vcbs2=g.querySelector('vCBS')||det.querySelector('vCBS');if(vcbs2&&vcbs2.textContent)base.CBS_vCBS=vcbs2.textContent.trim();}
      }else{const vcb=imp.querySelector('vCBS')||det.querySelector('vCBS');if(vcb&&vcb.textContent)base.CBS_vCBS=vcb.textContent.trim();}
    }
    produtos.push(base);
  }
  return{ok:true,produtos,msg:`${produtos.length} produto(s)`};
}

function extrairNFSe(nome,texto){
  const doc=parseXML(texto);const root=doc.documentElement;
  let tag=root.tagName;if(tag.includes('}'))tag=tag.split('}')[1];
  if(tag==='CompNFe'||root.querySelector('CompNFe'))return extrairCompNFe(root,nome);
  if(tag==='NFSe'||tag==='nfseProc'||root.querySelector('infNFSe'))return extrairNFSeNacional(root,nome);
  return{ok:false,msg:`Formato nao reconhecido (${tag})`};
}

// ═══ FILE HANDLING ═══
function detectType(texto){return(/CompNFe|<NFSe|infNFSe|nNFSe/i).test(texto.slice(0,600))?'nfse':'nfe';}

function logHTML(texto,tipo){
  const el=document.getElementById('import-log');
  const d=document.createElement('div');d.textContent=texto;
  const cores={err:'#e74c3c',ok:'#2ecc71',nfe:'#5dade2',nfse:'#f5b942',brd:'#2c3e50',info:'#95a5a6'};
  d.style.color=cores[tipo]||'#d5d8dc';
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}

async function handleFiles(files){
  const overlay=document.getElementById('loading-overlay');
  const msg=document.getElementById('loading-msg');
  const log=document.getElementById('import-log');
  const errb=document.getElementById('error-banner');
  errb.style.display='none';
  overlay.classList.add('active');
  log.innerHTML='';

  const arr=Array.from(files);
  msg.textContent=`Processando ${arr.length} arquivo(s)...`;
  logHTML(`📁 ${arr.length} arquivo(s) selecionados`,'info');
  logHTML('','brd');

  let nfeTotal=0,nfseTotal=0,errCount=0;
  const novosNFE=[],novosNFSE=[];

  for(let i=0;i<arr.length;i++){
    const file=arr[i];
    msg.textContent=`[${i+1}/${arr.length}] ${file.name}`;
    try{
      const texto=await readFileAsText(file);
      console.log(`OK ${file.name} (${texto.length} chars)`);
      const tipo=detectType(texto);
      if(tipo==='nfse'){
        const r=extrairNFSe(file.name,texto);
        if(r.ok&&r.notas&&r.notas.length){
          novosNFSE.push(...r.notas);nfseTotal+=r.notas.length;
          logHTML(`  [${i+1}/${arr.length}] [NFS-e] ${(file.name||'').slice(0,48).padEnd(48)} ${r.notas.length} nota(s)  [${(r.msg||'').slice(0,30)}]`,'nfse');
        }else{errCount++;logHTML(`  [${i+1}/${arr.length}] [NFS-e] ⚠ ${(file.name||'').slice(0,48)}  →  ${(r.msg||'erro').slice(0,50)}`,'err');}
      }else{
        const r=extrairNFE(file.name,texto);
        if(r.ok&&r.produtos&&r.produtos.length){
          novosNFE.push(...r.produtos);nfeTotal+=r.produtos.length;
          logHTML(`  [${i+1}/${arr.length}] [NF-e]  ${(file.name||'').slice(0,48).padEnd(48)} ${r.produtos.length} produto(s)  [${(r.msg||'').slice(0,30)}]`,'nfe');
        }else{errCount++;logHTML(`  [${i+1}/${arr.length}] [NF-e]  ⚠ ${(file.name||'').slice(0,48)}  →  ${(r.msg||'erro').slice(0,50)}`,'err');}
      }
    }catch(e){
      errCount++;const emsg=e.message||String(e);
      logHTML(`  [${i+1}/${arr.length}] ⚠ ${(file.name||'').slice(0,48)}  →  ${emsg.slice(0,80)}`,'err');
      console.error(`ERRO ${file.name}:`,e);
    }
  }

  DB.nfe.push(...novosNFE);DB.nfse.push(...novosNFSE);DB.arquivos+=arr.length;
  // Dedup
  const ck=new Set();DB.nfe=DB.nfe.filter(p=>{const k=`${p.Chave_NFe}_${p.Item}_${p.cProd}`;if(ck.has(k))return false;ck.add(k);return true;});
  const ck2=new Set();DB.nfse=DB.nfse.filter(n=>{const k=n.Chave_NFSe||n.Numero_NFSe||JSON.stringify(n);if(ck2.has(k))return false;ck2.add(k);return true;});

  logHTML('','brd');
  logHTML(`✅ Processados ${arr.length} arquivo(s) — ${novosNFE.length} produtos NF-e, ${novosNFSE.length} notas NFS-e${errCount?` (${errCount} erro(s))`:''}`,'ok');
  if(errCount&&!novosNFE.length&&!novosNFSE.length){
    errb.textContent='⚠ Nenhum XML foi processado. Verifique o console (F12 > Console) para detalhes do erro.';
    errb.style.display='block';
  }
  updateStatus();populateFilters();
  overlay.classList.remove('active');
  console.log(`DB: ${DB.nfe.length} NFE, ${DB.nfse.length} NFSE`);
}

function updateStatus(){
  document.getElementById('s-nfe').textContent=DB.nfe.length;
  document.getElementById('s-nfse').textContent=DB.nfse.length;
  document.getElementById('s-arqs').textContent=DB.arquivos;

  function bar(id,labels,data,label,formatter){if(data.length)dashCharts[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{label,data,backgroundColor:['#2980b9','#e67e22','#27ae60','#8e44ad','#c0392b','#16a085','#d35400','#1a5276','#7d6608','#117a65']}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{font:{size:9},callback:formatter||(v=>v)}},x:{ticks:{font:{size:8}}}},plugins:{legend:{display:false}}}});}

// ═══ EXPORT ═══
function exportCSV(tipo){
  const cab=tipo==='nfe'?HNFE:HNFSE;
  const dados=tipo==='nfe'?DB.nfe:DB.nfse;
  if(!dados.length){alert('Sem dados para exportar.');return;}
  let csv='\ufeff'+cab.join(',')+'\n';
  for(const row of dados){
    csv+=cab.map(c=>{const v=String(row[c]||'').replace(/"/g,'""');return/[,"\n]/.test(v)?`"${v}"`:v;}).join(',')+'\n';
  }
  const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`${tipo==='nfe'?'produtos_nfe':'servicos_nfse'}_${DB.sessaoId}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
}
function exportXLSX(tipo){
  const cab=tipo==='nfe'?HNFE:HNFSE;
  const dados=tipo==='nfe'?DB.nfe:DB.nfse;
  if(!dados.length){alert('Sem dados para exportar.');return;}
  const data=[cab,...dados.map(r=>cab.map(c=>r[c]||''))];
  const ws=XLSX.utils.aoa_to_sheet(data);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,tipo==='nfe'?'Produtos_NFe':'Servicos_NFSe');
  XLSX.writeFile(wb,`${tipo==='nfe'?'produtos_nfe':'servicos_nfse'}_${DB.sessaoId}.xlsx`);
}
